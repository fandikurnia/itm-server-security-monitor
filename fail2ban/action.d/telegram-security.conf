[Definition]
actionstart = /usr/local/sbin/security-notify "🛡️ FAIL2BAN STARTED | Jail: <name> | Monitoring enabled"
actionstop = /usr/local/sbin/security-notify "ℹ️ FAIL2BAN STOPPED | Jail: <name>"
actioncheck =
actionban = /usr/local/sbin/security-notify "🔴 SSH ATTACK BLOCKED | Jail: <name> | Source IP: <ip> | Action: BANNED"
actionunban = /usr/local/sbin/security-notify "🟢 IP UNBANNED | Jail: <name> | Source IP: <ip>"

[Init]
name = default
